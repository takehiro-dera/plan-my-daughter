*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg1);color:var(--ink);

button,input,select{font-family:inherit;color:inherit}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
h1{margin:0;font-size:28px;font-weight:700;line-height:1.2}

.nm{flex:1;font-size:21px;font-weight:700;line-height:1.25}
.tm{display:block;font-size:14px;color:var(--ink2);font-weight:500;margin-top:2px}
.ck{width:48px;height:48px;flex:none}

function renderList(){
var st=stats(),P=st.P,nm=nowMin(),isT=view===todayIdx(),h='';
if(!P.length)h='<div class="empty">きょうは よていが ないよ。<br>おうちの ひとに きいてね。</div>';
for(var i=0;i<P.length;i++){
var t=P[i],dn=isDone(view,t.id),cur=isT&&nm>=t.s&&nm<t.e;
h+='<button class="task'+(dn?' done':'')+(cur?' cur':'')+'" data-id="'+t.id+'" aria-pressed="'+dn+'"><span class="ic">'+esc(t.icon)+'</span><span class="nm">'+esc(t.name)+'<span class="tm">'+fmt(t.s)+' - '+fmt(t.e)+'</span>'+(t.memo?'<span class="tm" style="color:var(--ink)">'+esc(t.memo)+'</span>':'')+'</span><svg class="ck" viewBox="0 0 48 48">'+heart(24,24,1.7,dn?'#FF6FA8':'none',dn?'#D93F7E':'#ED93B1')+'</svg></button>';
}
$('list').innerHTML=h;
}
function renderTabs(){
var h='';
for(var i=0;i<7;i++){var d=ORDER[i];h+='<button class="tab" role="tab" data-d="'+d+'" aria-selected="'+(d===view)+'"><span class="an">'+AN[d]+'</span>'+DN[d]+'<span class="dn">'+dateOf(d).getDate()+'</span>'+(d===todayIdx()?'<span class="dot"></span>':'')+'</button>';}
$('tabs').innerHTML=h;
}
function dateOf(d){var p=weekDate(d).split('-');return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));}
function renderHeader(){
var n=dateOf(view);$('date').textContent=(view===todayIdx()?'きょう ':'')+(n.getMonth()+1)+'がつ'+n.getDate()+'にち ('+DN[view]+')';
$('mute').textContent=S.mute?'🔕':'🔔';
}
function total(){var n=0,k;for(k in S.pts.log){if(S.pts.log[k])n++;}return Math.max(0,n+(S.pts.adj||0));}
function sortedRew(){return PL.rewards.slice().sort(function(a,b){return a.pts-b.pts;});}
function renderPoints(){
var t=total(),R=sortedRew(),prev=0,next=null,i;
for(i=0;i<R.length;i++){if(R[i].pts>t){next=R[i];break;}prev=R[i].pts;}
var pc=next?Math.round((t-prev)/(next.pts-prev)*100):100;
var h='<div class="ptop"><div class="ptotal"><span class="pst">⭐</span><b>'+t+'</b><small>ポイント</small></div><div class="pnext">'+(next?'あと '+(next.pts-t)+' ポイントで<br><b>'+esc(next.icon)+' '+esc(next.name)+'</b>':(R.length?'ぜんぶの ごほうびを<br>ゲットしたよ！':'ごほうびは おうちの ひとと<br>きめようね'))+'</div></div>';
h+='<div class="pbar"><i style="width:'+pc+'%"></i></div><div class="stamps">';
for(i=0;i<7;i++){var d=ORDER[i],ea=!!S.pts.log[weekDate(d)];h+='<span class="stp'+(ea?' on':'')+(d===view?' cur':'')+'">'+(ea?'⭐':DN[d])+'</span>';}
h+='</div>';
$('pts').innerHTML=h;
}
function renderRewards(){
var R=sortedRew(),t=total(),h='';
if(!R.length){$('rewards').innerHTML='';return;}
h='<div class="rhead">ごほうび</div>';
for(var i=0;i<R.length;i++){
var r=R[i],got=t>=r.pts;
var st=S.claimed[r.id]?'<span class="rs">もらった ✓</span>':(got?'<span class="rs g">ゲット！</span>':'<span class="rs">あと '+(r.pts-t)+'</span>');
h+='<div class="rw'+(got?' got':'')+'"><span class="ic">'+esc(r.icon)+'</span><span class="nm">'+esc(r.name)+'<span class="tm">'+r.pts+' ポイント</span></span>'+st+'</div>';
}
$('rewards').innerHTML=h;
}

function renderFoot(){
var s='よてい '+(PL.updatedAt||'-');
if(plSource!=='online')s+='（'+(plSource==='cache'?'ほぞんデータ':'サンプル')+'）';
if(plErr.length)s+=' ⚠ よてい ファイルに エラー';
$('foot').textContent=s;
}
function renderAll(){
renderHeader();renderTabs();renderRing();
$('view').style.display=parent?'none':'block';
$('parent').style.display=parent?'block':'none';
if(parent){renderParent();}else{renderStatus();renderHearts();renderPoints();renderList();renderRewards();renderFoot();}
}
function hmNow(t){if(!t)return '-';var d=new Date(t);return d.getMonth()+1+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function renderParent(){
var t=total(),R=sortedRew();
var src=plSource==='online'?'オンラインから取得した予定を使用中':(plSource==='cache'?'保存済みの予定を使用中（最後に取得できたもの）':'アプリ内蔵のサンプルを使用中');
var h='<div class="panel"><h2>おうちの方へ</h2><p>保護者向けの画面です。ここで予定ファイルの状態確認・ポイント補正・バックアップができます。</p>';
h+='<div class="sub" style="margin:0 0 6px">予定ファイル（plans.json）</div><dl class="kv"><dt>状態</dt><dd>'+esc(src)+'</dd><dt>版</dt><dd>'+esc(PL.updatedAt||'-')+'（version '+esc(PL.version||'-')+'）</dd><dt>最後に取得</dt><dd>'+esc(hmNow(lastOk))+(netFail?'（通信できませんでした）':'')+'</dd><dt>保存先</dt><dd>'+esc(NS)+'</dd></dl>';
if(plErr.length){h+='<div class="errs on">plans.json にエラーがあるため、前の予定を使っています：<br>'+plErr.slice(0,6).map(esc).join('<br>')+'</div>';}
h+='<div class="btns" style="margin:0 0 14px"><button class="btn sec" data-act="refresh">いま更新する</button></div>';
h+='<div class="sub" style="margin:0 0 6px">ポイント：<b id="ptv">'+t+'</b></div><div class="btns" style="margin:0 0 6px"><button class="btn sec" data-act="padj" data-v="-1">− 1</button><button class="btn sec" data-act="padj" data-v="1">＋ 1</button><button class="btn sec" data-act="preset">'+(pArm?'本当に 0 に戻す？':'0 に戻す')+'</button></div>';
if(R.length){h+='<div class="sub">ごほうびを渡したら チェック</div>';R.forEach(function(r){h+='<label class="chk"><input type="checkbox" data-claim="'+esc(r.id)+'"'+(S.claimed[r.id]?' checked':'')+'><span>'+esc(r.icon)+' '+esc(r.name)+'（'+r.pts+'ポイント）</span></label>';});}
h+='<div class="sub">バックアップ</div><p class="note">ポイントと達成記録はこの端末の中にだけあります。ときどき「書き出す」でコピーして、メモなどに保存してください。「読み込む」で復元できます。</p><textarea id="bk" aria-label="バックアップ">'+esc(backupText)+'</textarea><div class="btns"><button class="btn sec" data-act="bkout">書き出す</button><button class="btn sec" data-act="bkcopy">コピー</button><button class="btn sec" data-act="bkin">読み込む</button></div>';
h+='<div class="btns"><button class="btn" data-act="close">閉じる</button></div></div>';
$('parent').innerHTML=h;
}
function refresh(force){
if(location.protocol==='file:'){if(force)toast('この開き方では更新できません');return Promise.resolve();}
return fetch('plans.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(o){
var before=JSON.stringify(PL),beforeSrc=plSource,beforeErr=plErr.length,ok=setPlans(o,'online');
if(ok){lastOk=Date.now();netFail=false;try{localStorage.setItem(PKEY,JSON.stringify(o));}catch(e){}if(force)toast('予定を更新しました');}
else if(force){toast('plans.json にエラーがあります');}
if(JSON.stringify(PL)!==before||plSource!==beforeSrc||beforeErr!==plErr.length||force||plErr.length){renderAll();}
}).catch(function(){netFail=true;if(force)toast('通信できませんでした');if(parent)renderAll();});
}
function toggleParent(){parent=!parent;pArm=false;renderAll();if(parent)window.scrollTo(0,0);}
var gp=null,gear=$('gear');
function gDown(){gear.classList.add('pressing');clearTimeout(gp);gp=setTimeout(function(){gear.classList.remove('pressing');toggleParent();gp=null;},700);}
function gUp(){gear.classList.remove('pressing');clearTimeout(gp);gp=null;}
gear.addEventListener('pointerdown',gDown);
gear.addEventListener('pointerup',gUp);
gear.addEventListener('pointerleave',gUp);
gear.addEventListener('pointercancel',gUp);
gear.addEventListener('contextmenu',function(e){e.preventDefault();});
gear.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleParent();}});
function exportData(){return JSON.stringify({app:'kids-schedule',v:2,exportedAt:new Date().toISOString(),pts:S.pts,claimed:S.claimed,done:S.done,mute:S.mute});}
$('parent').addEventListener('change',function(e){
var c=e.target.getAttribute&&e.target.getAttribute('data-claim');
if(c){if(e.target.checked){S.claimed[c]=true;}else{delete S.claimed[c];}save();}
});
$('parent').addEventListener('input',function(e){if(e.target.id==='bk')backupText=e.target.value;});
$('parent').addEventListener('click',function(e){
var b=e.target.closest('[data-act]');if(!b)return;
var act=b.getAttribute('data-act');
if(act==='close'){parent=false;pArm=false;renderAll();return;}
if(act==='refresh'){refresh(true);return;}
if(act==='padj'){var v=parseInt(b.getAttribute('data-v'),10);if(total()+v<0)return;S.pts.adj=(S.pts.adj||0)+v;save();var el=$('ptv');if(el)el.textContent=total();return;}
if(act==='preset'){
if(!pArm){pArm=true;renderParent();setTimeout(function(){if(pArm&&parent){pArm=false;renderParent();}},3500);return;}
pArm=false;S.pts={log:{},adj:0};save();renderParent();toast('ポイントを 0 に戻しました');return;
}
if(act==='bkout'){backupText=exportData();renderParent();return;}
if(act==='bkcopy'){
var ta=$('bk');if(!ta.value){backupText=exportData();renderParent();ta=$('bk');}
var txt=ta.value;
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('コピーしました');},function(){ta.select();toast('選択しました。コピーしてください');});}
else{ta.select();try{document.execCommand('copy');toast('コピーしました');}catch(x){toast('選択しました。コピーしてください');}}
return;
}
if(act==='bkin'){
var raw=($('bk').value||'').trim(),o=null;
try{o=JSON.parse(raw);}catch(x){}
if(!o||o.app!=='kids-schedule'||!o.pts){toast('バックアップの形式が正しくありません');return;}
S.pts=o.pts;S.claimed=o.claimed||{};S.done=o.done||{};if(typeof o.mute==='boolean')S.mute=o.mute;
S=normS(S);save();backupText='';renderAll();toast('読み込みました');return;
}
});
var AC=null;
function ac(){if(S.mute)return null;try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,t0,dur,type,vol){var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);}catch(e){}}
function sfx(k){
if(k==='pop'){tone(784,0,0.12,'sine',0.18);tone(1175,0.07,0.18,'sine',0.16);}
else if(k==='un'){tone(392,0,0.14,'sine',0.1);}
else if(k==='fan'){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,i*0.11,0.26,'triangle',0.16);});}
}
function burst(x,y){
if(REDUCE||!document.body.animate)return;
var em=['💗','✨','⭐','💖'];
for(var i=0;i<9;i++){
var el=document.createElement('span'),a=(i/9)*Math.PI*2,dist=50+Math.random()*40;
el.textContent=em[i%em.length];
el.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;font-size:'+(18+Math.random()*10)+'px;pointer-events:none;z-index:65;margin:-12px 0 0 -12px';
document.body.appendChild(el);
var an=el.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:'translate('+(Math.cos(a)*dist)+'px,'+(Math.sin(a)*dist-20)+'px) scale(1.1)',opacity:1,offset:.6},{transform:'translate('+(Math.cos(a)*dist*1.15)+'px,'+(Math.sin(a)*dist*1.15+10)+'px) scale(.8)',opacity:0}],{duration:750,easing:'ease-out'});
an.onfinish=(function(e){return function(){e.remove();};})(el);
}
}
function confetti(){
if(REDUCE)return;
var cv=$('cf'),dpr=window.devicePixelRatio||1,w=window.innerWidth,h=window.innerHeight;
cv.width=w*dpr;cv.height=h*dpr;
var cx=cv.getContext('2d');cx.scale(dpr,dpr);
var cols=['#FF6FA8','#FFC6DE','#B9A2F5','#FAC775','#7DDCB8','#8FC8FF'],ps=[],i;
for(i=0;i<150;i++){ps.push({x:w/2+(Math.random()-.5)*w*.4,y:h*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,k:i%3});}
var t0=performance.now();
function fr(now){
var el=now-t0;cx.clearRect(0,0,w,h);
for(var j=0;j<ps.length;j++){
var p=ps[j];p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.r+=p.vr;
cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,1-el/3600);
if(p.k===0){cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);}
else if(p.k===1){cx.beginPath();cx.arc(0,0,p.s/2,0,Math.PI*2);cx.fill();}
else{cx.font=(p.s*2)+'px sans-serif';cx.textAlign='center';cx.fillText('♥',0,p.s/2);}
cx.restore();
}
if(el<3600){requestAnimationFrame(fr);}else{cx.clearRect(0,0,w,h);}
}
requestAnimationFrame(fr);
}
var toastT=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2600);}
var celeT=null;
function celebrate(info){
$('celechr').innerHTML='<g>'+chr(view,'big','c')+'</g>';
var ch='';
if(info&&info.gained){ch='<span class="cp1">⭐ ＋1 ポイント！</span><span>ぜんぶで '+info.total+' ポイント</span>';}
else{ch='<span>きょうの ポイントは もう もらっているよ</span>';}
if(info&&info.unlocked){for(var u=0;u<info.unlocked.length;u++){ch+='<span class="cp2">'+esc(info.unlocked[u].icon)+' 「'+esc(info.unlocked[u].name)+'」 ゲット！</span>';}}
$('cpt').innerHTML=ch;
$('cele').classList.add('on');sfx('fan');confetti();
clearTimeout(celeT);celeT=setTimeout(function(){$('cele').classList.remove('on');},5000);
}
function jump(){var c=$('chr');if(!c)return;c.classList.remove('jump');void c.getBoundingClientRect();c.classList.add('jump');}

function toggle(id,x,y){
if(view!==todayIdx()){toast('その ひに なったら おしてね');return;}
var set=doneSet(view),i=set.indexOf(id),info=null;
if(i>=0){set.splice(i,1);sfx('un');}
else{
set.push(id);sfx('pop');burst(x,y);
var st0=stats();
if(st0.P.length&&st0.n===st0.P.length){
info={gained:false,total:total(),unlocked:[]};
var dk=weekDate(view);
if(!S.pts.log[dk]){var bf=total();S.pts.log[dk]=1;var af=total();info={gained:true,total:af,unlocked:PL.rewards.filter(function(r){return r.pts>bf&&r.pts<=af;})};}
}
}
save();renderAll();
if(i<0){jump();if(info){setTimeout(function(){celebrate(info);},350);}}
}

$('tabs').addEventListener('click',function(e){
var b=e.target.closest('.tab');if(!b)return;
view=parseInt(b.getAttribute('data-d'),10);
parent=false;renderAll();
});
$('list').addEventListener('click',function(e){var b=e.target.closest('.task');if(!b)return;toggle(b.getAttribute('data-id'),e.clientX,e.clientY);});
$('ring').addEventListener('click',function(e){var p=e.target.closest('.sg');if(!p)return;toggle(p.getAttribute('data-id'),e.clientX,e.clientY);});
$('mute').addEventListener('click',function(){S.mute=!S.mute;save();renderHeader();if(!S.mute)sfx('pop');});
$('cele').addEventListener('click',function(){$('cele').classList.remove('on');});

var decoEm=['✦','♥','★','✦','♥','★','✦','♥'];
var dh='';
for(var di=0;di<decoEm.length;di++){dh+='<span style="left:'+(6+di*12.5)+'%;top:'+(8+((di*37)%80))+'%;color:var('+(di%2?'--deco2':'--deco1')+');animation-delay:'+(di*0.8)+'s;opacity:.55;font-size:'+(20+(di%3)*8)+'px">'+decoEm[di]+'</span>';}
$('deco').innerHTML=dh;


var lastMin=-1,lastDay=todayIdx(),lastFetch=Date.now();
setInterval(function(){
var td=todayIdx();if(td!==lastDay){lastDay=td;view=td;parent=false;renderAll();}
var m=Math.floor(nowMin());
if(m!==lastMin){lastMin=m;if(!parent){renderRing();renderStatus();renderList();}renderHeader();}
if(Date.now()-lastFetch>600000){lastFetch=Date.now();refresh(false);}
},15000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lastFetch=Date.now();refresh(false);}});
renderAll();
lastMin=Math.floor(nowMin());
refresh(false);
})();
</script>
</body>
</html>
